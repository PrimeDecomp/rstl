name: Build games

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: ${{ matrix.game }} (${{ matrix.version }})
    # These jobs need private sources and original game files.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    container: ghcr.io/primedecomp/build:main
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Prime 1
          - game: prime
            version: GM8EAB_00
          - game: prime
            version: GM8E01_00
          - game: prime
            version: GM8E01_01
          - game: prime
            version: GM8E01_48
          - game: prime
            version: GM8E01_02
          - game: prime
            version: GM8P01_00
          - game: prime
            version: GM8J01_DD
          - game: prime
            version: GM8J01_00
          - game: prime
            version: R3IJ01_00
          - game: prime
            version: R3ME01_00
          - game: prime
            version: R3MP01_00

          # Echoes
          - game: echoes
            version: P2ME01
          - game: echoes
            version: D75E01
          - game: echoes
            version: D84P01
          - game: echoes
            version: G2ME01
          - game: echoes
            version: G2MP01
          - game: echoes
            version: G2MJ01
          - game: echoes
            version: R3ME01

          # Corruption Prototype
          - game: corruption-proto
            version: G2MEAB
    defaults:
      run:
        working-directory: game

    steps:
      - name: Create game repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PrimeDecomp
          repositories: ${{ matrix.game }}
          permission-contents: read

      - name: Checkout game main
        id: game
        uses: actions/checkout@v7
        with:
          repository: PrimeDecomp/${{ matrix.game }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: game
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # Override the game's pinned submodule with the RSTL revision under test.
      # On pull_request, checkout defaults to GitHub's PR merge commit.
      - name: Checkout RSTL under test
        uses: actions/checkout@v7
        with:
          path: game/extern/rstl
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested revisions
        run: |
          echo "Game: $(git rev-parse HEAD)"
          echo "RSTL: $(git -C extern/rstl rev-parse HEAD)"

      # Copy the original files to the workspace
      - name: Prepare original files
        run: cp -av /orig/${{ matrix.version }}/ orig/
        
      # Tools are cached apart from the build, keyed by the tool tags in configure.py.
      # Cache paths are relative to the workspace root, hence the game/ prefix.
      - name: Hash tool tags
        id: tools-hash
        run: echo "hash=$(grep _tag configure.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore tool cache
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            game/build/tools
            game/build/compilers
            game/build/binutils
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-hash.outputs.hash }}

      # Restore cached files. --portable-build-ninja keeps paths in build.ninja and the
      # Ninja logs relative, so the cache can be shared between runners and workspaces.
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            game/build
            !game/build/tools
            !game/build/compilers
            !game/build/binutils
            game/.ninja_deps
            game/.ninja_log
          key: build-v5-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ github.sha }}
          restore-keys: build-v5-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-

      # Ninja rebuilds an output only when an input is newer than it. Checkout gives
      # every file the current time; files whose content matches the cached build get
      # an old fixed time instead, so only changed files are newer than cached objects.
      - name: Mark unchanged sources
        run: |
          # Ninja downloads a tool again when download_tool.py is newer than it
          touch -t 200001010000 tools/download_tool.py
          if [ ! -f build/sources.txt ]; then
            echo "No build/sources.txt in the restored cache; every file keeps its checkout time"
            exit 0
          fi
          git ls-files -s --recurse-submodules > "$RUNNER_TEMP/sources.txt"
          awk -F '\t' 'NR == FNR { cached[$0]; next } $0 in cached { print $2 }' \
            build/sources.txt "$RUNNER_TEMP/sources.txt" > "$RUNNER_TEMP/unchanged.txt"
          echo "Marking $(wc -l < "$RUNNER_TEMP/unchanged.txt") of $(wc -l < "$RUNNER_TEMP/sources.txt") files unchanged"
          echo "::group::Changed since the cached build"
          awk -F '\t' 'NR == FNR { cached[$0]; next } !($0 in cached) { print $2 }' \
            build/sources.txt "$RUNNER_TEMP/sources.txt"
          echo "::endgroup::"
          tr '\n' '\0' < "$RUNNER_TEMP/unchanged.txt" | xargs -0 -r touch -t 200001010000 --
          
      - name: Build
        env:
          MAP_FLAG: ${{ github.event_name == 'workflow_dispatch' && '--map' || '' }}
        run: |
          python3 -m venv .venv
          .venv/bin/python configure.py --portable-build-ninja $MAP_FLAG --version ${{ matrix.version }}
          mwcc-tools run ninja all_source progress build/${{ matrix.version }}/report.json
  
      - name: Save tool cache
        uses: actions/cache/save@v6
        if: ${{ steps.tool-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            game/build/tools
            game/build/compilers
            game/build/binutils
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      - name: Save build cache
        uses: actions/cache/save@v6
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: |
            game/build
            !game/build/tools
            !game/build/compilers
            !game/build/binutils
            game/.ninja_deps
            game/.ninja_log
          key: ${{ steps.cache.outputs.cache-primary-key }}
